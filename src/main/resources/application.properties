app.name=DriveEase
spring.application.name=carrental
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/car_rental}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:yourlocalpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.port=${PORT:8080}

app.admin.name=System Admin
app.admin.email=admin@carrental.com
app.admin.password=${ADMIN_PASSWORD}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB