
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Manage Bookings')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="admin-page py-4">
    <div class="container-fluid admin-container px-3 px-md-4">

        <div class="page-header">
            <div>
                <h2 class="page-title">Manage Bookings</h2>
                <p class="page-subtitle">View reservations and manage customer rental activity.</p>
            </div>
        </div>

        <div class="alert alert-success admin-alert" th:if="${success}" th:text="${success}">Done</div>
        <div class="alert alert-danger admin-alert" th:if="${error}" th:text="${error}">Error</div>

        <div class="filter-panel">
            <div class="filter-buttons">
                <a class="btn"
                   th:classappend="${selectedStatus == ''} ? ' active-filter' : ' btn-outline-secondary'"
                   th:href="@{/admin/bookings}">All</a>
                <a class="btn"
                   th:classappend="${selectedStatus == 'PENDING'} ? ' active-filter' : ' btn-outline-secondary'"
                   th:href="@{/admin/bookings(status='PENDING')}">Pending</a>
                <a class="btn"
                   th:classappend="${selectedStatus == 'CONFIRMED'} ? ' active-filter' : ' btn-outline-secondary'"
                   th:href="@{/admin/bookings(status='CONFIRMED')}">Confirmed</a>
                <a class="btn"
                   th:classappend="${selectedStatus == 'COMPLETED'} ? ' active-filter' : ' btn-outline-secondary'"
                   th:href="@{/admin/bookings(status='COMPLETED')}">Completed</a>
                <a class="btn"
                   th:classappend="${selectedStatus == 'CANCELLED'} ? ' active-filter' : ' btn-outline-secondary'"
                   th:href="@{/admin/bookings(status='CANCELLED')}">Cancelled</a>
            </div>
        </div>

        <div class="table-panel">
            <div class="table-responsive">
                <table class="table admin-table align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Customer</th>
                        <th>Car</th>
                        <th>Pickup</th>
                        <th>Return</th>
                        <th class="text-end">Rental</th>
                        <th>Status</th>
                        <th class="text-end">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(bookings)}">
                        <td colspan="8" class="empty-state">No bookings found.</td>
                    </tr>
                    <tr th:each="b : ${bookings}">
                        <td th:text="${b.bookingId}">1</td>
                        <td>
                            <div class="primary-cell" th:text="${b.customer.user.userName}">Name</div>
                            <div class="secondary-cell" th:text="${b.customer.user.email}">email</div>
                        </td>
                        <td class="primary-cell" th:text="${b.car.brand + ' ' + b.car.model}">Brand Model</td>
                        <td th:text="${#strings.replace(b.pickupDateTime, 'T', ' ')}">-</td>
                        <td th:text="${#strings.replace(b.returnDateTime, 'T', ' ')}">-</td>
                        <td class="text-end fw-semibold"
                            th:text="'₹' + ${#numbers.formatDecimal(b.totalCost, 1, 'COMMA', 2, 'POINT')}">₹0.00</td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${b.status.name() == 'CONFIRMED'} ? ' status-confirmed' : (${b.status.name() == 'PENDING'} ? ' status-pending' : (${b.status.name() == 'COMPLETED'} ? ' status-default' : ' status-cancelled'))"
                                  th:text="${b.status}">PENDING</span>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-outline-primary action-btn"
                               th:href="@{/admin/bookings/{id}(id=${b.bookingId})}">View Details</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
