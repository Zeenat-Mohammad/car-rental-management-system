<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Car')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 820px;">
    <h2 class="mb-3" th:text="${pageTitle}">Add Car</h2>

    <div class="card shadow-sm">
        <div class="card-body p-4">

            <form th:action="@{${formAction}}" th:object="${carForm}" method="post"
                  enctype="multipart/form-data" novalidate>

                <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
                    <div th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="brand" class="form-label">Brand</label>
                        <input type="text" class="form-control" id="brand" th:field="*{brand}"
                               th:classappend="${#fields.hasErrors('brand')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{brand}">Error</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="model" class="form-label">Model</label>
                        <input type="text" class="form-control" id="model" th:field="*{model}"
                               th:classappend="${#fields.hasErrors('model')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{model}">Error</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="registrationNumber" class="form-label">Registration number</label>
                        <input type="text" class="form-control" id="registrationNumber" th:field="*{registrationNumber}"
                               placeholder="MH12 AB 1234"
                               th:classappend="${#fields.hasErrors('registrationNumber')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{registrationNumber}">Error</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" th:field="*{category}"
                                th:classappend="${#fields.hasErrors('category')} ? 'is-invalid'">
                            <option value="">Select category</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}">SUV</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{category}">Error</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="color" class="form-label">Color</label>
                        <input type="text" class="form-control" id="color" th:field="*{color}"
                               th:classappend="${#fields.hasErrors('color')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{color}">Error</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="manufactureYear" class="form-label">Manufacture year</label>
                        <input type="number" class="form-control" id="manufactureYear" th:field="*{manufactureYear}"
                               th:classappend="${#fields.hasErrors('manufactureYear')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{manufactureYear}">Error</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="fuelType" class="form-label">Fuel type</label>
                        <select class="form-select" id="fuelType" th:field="*{fuelType}"
                                th:classappend="${#fields.hasErrors('fuelType')} ? 'is-invalid'">
                            <option value="">Select fuel type</option>
                            <option th:each="f : ${fuelTypes}" th:value="${f}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(f))}">Petrol</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{fuelType}">Error</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="transmission" class="form-label">Transmission</label>
                        <select class="form-select" id="transmission" th:field="*{transmission}"
                                th:classappend="${#fields.hasErrors('transmission')} ? 'is-invalid'">
                            <option value="">Select transmission</option>
                            <option th:each="t : ${transmissions}" th:value="${t}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(t))}">Manual</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{transmission}">Error</div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="totalSeat" class="form-label">Seats</label>
                        <input type="number" class="form-control" id="totalSeat" th:field="*{totalSeat}"
                               th:classappend="${#fields.hasErrors('totalSeat')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{totalSeat}">Error</div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="rate" class="form-label">Daily rate (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="rate" th:field="*{rate}"
                               th:classappend="${#fields.hasErrors('rate')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{rate}">Error</div>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="status" class="form-label">Availability status</label>
                        <select class="form-select" id="status" th:field="*{status}"
                                th:classappend="${#fields.hasErrors('status')} ? 'is-invalid'">
                            <option th:each="s : ${statuses}" th:value="${s}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(s, '_', ' ')))}">Available</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{status}">Error</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description (optional)</label>
                    <textarea class="form-control" id="description" rows="3" th:field="*{description}"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"></textarea>
                    <div class="invalid-feedback" th:errors="*{description}">Error</div>
                </div>

                <div class="mb-4">
                    <label for="image" class="form-label">Car image (JPG, PNG or WEBP, up to 5 MB)</label>
                    <div class="mb-2" th:if="${carForm.existingImageUrl != null}">
                        <img th:src="@{${carForm.existingImageUrl}}" class="img-thumbnail" style="max-height: 140px;" alt="Current image">
                        <div class="form-text">Choose a new file only if you want to replace this image.</div>
                    </div>
                    <input type="file" class="form-control" id="image" name="image"
                           accept="image/jpeg,image/png,image/webp"
                           th:classappend="${#fields.hasErrors('image')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{image}">Error</div>
                </div>

                <button type="submit" class="btn btn-primary">Save car</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/cars}">Cancel</a>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
