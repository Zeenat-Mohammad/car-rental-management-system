<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Cars')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-end mb-3">
        <div>
            <h2 class="mb-0">Our cars</h2>
            <p class="text-muted mb-0" th:text="${#lists.size(cars)} + (${#lists.size(cars) == 1} ? ' car found' : ' cars found')">6 cars found</p>
        </div>
    </div>

    <div class="alert alert-danger" th:if="${error}" th:text="${error}">Error</div>
    <div class="alert alert-warning" th:if="${filterError}" th:text="${filterError}">Filter error</div>

    <div class="row g-4">

        <!-- Filters -->
        <div class="col-lg-3">
            <form th:action="@{/cars}" method="get" class="card border-0 shadow-sm">
                <div class="card-body">
                    <h5 class="mb-3"><i class="bi bi-funnel me-1"></i>Filters</h5>

                    <div class="mb-3">
                        <label for="keyword" class="form-label">Brand or model</label>
                        <input type="text" class="form-control" id="keyword" name="keyword"
                               th:value="${keyword}" placeholder="e.g. Toyota">
                    </div>
                    <div class="mb-3">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category">
                            <option value="">All</option>
                            <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"
                                    th:selected="${c == category}">SUV</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="fuel" class="form-label">Fuel</label>
                        <select class="form-select" id="fuel" name="fuel">
                            <option value="">All</option>
                            <option th:each="f : ${fuelTypes}" th:value="${f.name()}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(f.name()))}"
                                    th:selected="${f.name() == fuel}">Petrol</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="transmission" class="form-label">Transmission</label>
                        <select class="form-select" id="transmission" name="transmission">
                            <option value="">All</option>
                            <option th:each="t : ${transmissions}" th:value="${t.name()}"
                                    th:text="${#strings.capitalize(#strings.toLowerCase(t.name()))}"
                                    th:selected="${t.name() == transmission}">Manual</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="minSeats" class="form-label">Seats</label>
                        <select class="form-select" id="minSeats" name="minSeats">
                            <option value="">Any</option>
                            <option value="4" th:selected="${minSeats != null and minSeats == 4}">4 or more</option>
                            <option value="5" th:selected="${minSeats != null and minSeats == 5}">5 or more</option>
                            <option value="7" th:selected="${minSeats != null and minSeats == 7}">7 or more</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Price per day (₹)</label>
                        <div class="d-flex gap-2">
                            <input type="number" min="0" class="form-control" name="minPrice" th:value="${minPrice}" placeholder="Min">
                            <input type="number" min="0" class="form-control" name="maxPrice" th:value="${maxPrice}" placeholder="Max">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="sort" class="form-label">Sort by</label>
                        <select class="form-select" id="sort" name="sort">
                            <option value="price_asc" th:selected="${sort == null or sort == 'price_asc'}">Price: low to high</option>
                            <option value="price_desc" th:selected="${sort == 'price_desc'}">Price: high to low</option>
                            <option value="newest" th:selected="${sort == 'newest'}">Newest added</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-2">Apply filters</button>
                    <a class="btn btn-outline-secondary w-100" th:href="@{/cars}">Reset</a>
                </div>
            </form>
        </div>

        <!-- Cars -->
        <div class="col-lg-9">
            <div class="row g-4">
                <div class="col-md-6 col-xl-4" th:each="car : ${cars}">
                    <div class="card h-100 shadow-sm car-card border-0">
                        <div class="position-relative">
                            <img th:if="${car.imageUrl != null}" th:src="@{${car.imageUrl}}"
                                 class="card-img-top car-card-img" th:alt="${car.brand + ' ' + car.model}">
                            <div th:if="${car.imageUrl == null}" class="car-card-noimg">No image</div>
                            <span class="badge bg-dark position-absolute top-0 end-0 m-2 opacity-75"
                                  th:if="${car.status.name() != 'AVAILABLE'}">Unavailable</span>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex justify-content-between align-items-start">
                                <h5 class="card-title mb-1" th:text="${car.brand + ' ' + car.model}">Brand Model</h5>
                                <span class="badge bg-secondary" th:text="${car.category}">SUV</span>
                            </div>
                            <p class="text-muted small mb-3"
                               th:text="${car.manufactureYear} + ' | ' + ${#strings.capitalize(#strings.toLowerCase(car.fuelType))} + ' | ' + ${#strings.capitalize(#strings.toLowerCase(car.transmission))} + ' | ' + ${car.totalSeat} + ' seats'">
                                2022 | Petrol | Manual | 5 seats</p>
                            <div class="mt-auto d-flex justify-content-between align-items-center">
                                <div class="fs-5 fw-bold text-primary">
                                    <span th:text="'₹' + ${#numbers.formatDecimal(car.rate, 1, 'COMMA', 0, 'POINT')}">₹0</span>
                                    <small class="text-muted fw-normal fs-6">/ day</small>
                                </div>
                                <a class="btn"
                                   th:classappend="${car.status.name() == 'AVAILABLE'} ? 'btn-primary' : 'btn-outline-secondary'"
                                   th:href="@{/cars/{id}(id=${car.carId})}">View details</a>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12" th:if="${#lists.isEmpty(cars)}">
                    <div class="card border-0 shadow-sm"><div class="card-body text-center text-muted py-5">
                        No cars match these filters. <a th:href="@{/cars}">Reset filters</a>
                    </div></div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
