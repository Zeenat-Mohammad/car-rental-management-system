<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="carCard(car)" class="col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm car-card">
        <img th:if="${car.imageUrl != null}" th:src="@{${car.imageUrl}}"
             class="card-img-top car-card-img" th:alt="${car.brand + ' ' + car.model}">
        <div th:if="${car.imageUrl == null}" class="car-card-noimg">No image</div>

        <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start">
                <h5 class="card-title mb-1" th:text="${car.brand + ' ' + car.model}">Brand Model</h5>
                <span class="badge bg-secondary" th:text="${car.category}">SUV</span>
            </div>
            <p class="text-muted small mb-3"
               th:text="${car.manufactureYear} + ' | ' + ${#strings.capitalize(#strings.toLowerCase(car.fuelType))} + ' | ' + ${#strings.capitalize(#strings.toLowerCase(car.transmission))} + ' | ' + ${car.totalSeat} + ' seats'">
                2022 | Petrol | Manual | 5 seats</p>

            <div class="mt-auto d-flex justify-content-between align-items-center">
                <div class="fs-5 fw-bold text-primary">
                    <span th:text="'₹' + ${#numbers.formatDecimal(car.rate, 1, 'COMMA', 0, 'POINT')}">₹0</span>
                    <small class="text-muted fw-normal fs-6">/ day</small>
                </div>
                <a class="btn btn-primary" th:href="@{/cars/{id}(id=${car.carId})}">View details</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
